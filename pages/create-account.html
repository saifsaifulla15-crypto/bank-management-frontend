<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Bank Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-university" style="margin-right: 0.75rem;"></i>
                BankAdmin
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Overview</div>
                    <a href="../index.html" class="nav-link">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Banks</div>
                    <a href="banks.html" class="nav-link">
                        <i class="fas fa-building"></i> All Banks
                    </a>
                    <a href="create-bank.html" class="nav-link">
                        <i class="fas fa-plus-circle"></i> Create Bank
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Accounts</div>
                    <a href="accounts.html" class="nav-link">
                        <i class="fas fa-users"></i> All Accounts
                    </a>
                    <a href="create-account.html" class="nav-link active">
                        <i class="fas fa-user-plus"></i> Create Account
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Transactions</div>
                    <a href="transactions.html" class="nav-link">
                        <i class="fas fa-exchange-alt"></i> Menu
                    </a>
                    <a href="deposit.html" class="nav-link">
                        <i class="fas fa-arrow-down"></i> Deposit
                    </a>
                    <a href="withdraw.html" class="nav-link">
                        <i class="fas fa-arrow-up"></i> Withdraw
                    </a>
                    <a href="transfer.html" class="nav-link">
                        <i class="fas fa-random"></i> Transfer
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Navbar -->
            <header class="navbar">
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div style="flex: 1;"></div>
                <div class="user-profile">
                    <span class="avatar">A</span>
                    <span style="font-weight: 500; font-size: 0.95rem;">Admin User</span>
                </div>
            </header>

            <!-- Page Content -->
            <main class="content-area">
                <div class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h1 class="page-title">Create New Account</h1>
                        <p class="page-description">Open a new bank account for a customer</p>
                    </div>
                    <a href="accounts.html" class="btn btn-outline">
                        <i class="fas fa-arrow-left"></i> Back to Accounts
                    </a>
                </div>

                <div class="card" style="max-width: 600px; margin: 0 auto;">
                    <form id="create-account-form" novalidate>
                        <div class="form-group">
                            <label class="form-label" for="bankId">Select Bank *</label>
                            <select id="bankId" name="bankId" class="form-control" required>
                                <option value="">Loading banks...</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="accountHolderName">Account Holder Name *</label>
                            <input type="text" id="accountHolderName" name="accountHolderName" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="accountNumber">Account Number (Optional/Generated)</label>
                            <input type="text" id="accountNumber" name="accountNumber" class="form-control" placeholder="Leave blank to auto-generate">
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label" for="accountType">Account Type *</label>
                                <select id="accountType" name="accountType" class="form-control" required>
                                    <option value="">Select Type</option>
                                    <option value="SAVINGS">Savings</option>
                                    <option value="CURRENT_TYPE">Current</option>
                                    <option value="FIXED_DEPOSITE">Fixed Deposit</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="balance">Initial Balance (₹) *</label>
                                <input type="number" id="balance" name="balance" class="form-control" required min="0" step="0.01">
                            </div>
                        </div>

                        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                            <button type="button" class="btn btn-outline" onclick="window.location.href='accounts.html'">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="submit-btn">Create Account</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Load banks for the dropdown
            const bankSelect = document.getElementById('bankId');
            try {
                // We'll load up to 100 banks for the dropdown, ideally this should be a searchable select for large datasets
                const response = await BankAPI.getBanksPaged(0, 100, 'bankName');
                const banks = response.data?.content || [];
                
                if (banks.length === 0) {
                    bankSelect.innerHTML = '<option value="">No banks available - Create one first</option>';
                    document.getElementById('submit-btn').disabled = true;
                } else {
                    bankSelect.innerHTML = '<option value="">Select Bank</option>' + 
                        banks.map(b => `<option value="${b.bankId}">${b.bankName} (${b.ifsc})</option>`).join('');
                }
            } catch (error) {
                bankSelect.innerHTML = '<option value="">Failed to load banks</option>';
                showToast('Failed to load banks', 'error');
            }
        });

        document.getElementById('create-account-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const submitBtn = document.getElementById('submit-btn');
            
            clearAllErrors(form);
            let isValid = true;

            const bankId = form.bankId.value;
            if (!bankId) { showError(form.bankId, 'Bank must be selected'); isValid = false; }

            const accountHolderName = form.accountHolderName.value.trim();
            if (!accountHolderName) { showError(form.accountHolderName, 'Holder name is required'); isValid = false; }

            const accountType = form.accountType.value;
            if (!accountType) { showError(form.accountType, 'Account type is required'); isValid = false; }

            const balance = parseFloat(form.balance.value);
            if (isNaN(balance) || balance < 0) { showError(form.balance, 'Valid positive balance required'); isValid = false; }

            const accountNumber = form.accountNumber.value.trim() || `ACC${Date.now()}`; // Fallback auto-gen

            if (!isValid) return;

            const payload = {
                accountNumber,
                accountHolderName,
                accountType,
                balance,
                bank: { bankId: parseInt(bankId) }
            };

            console.log("Selected Bank ID:", bankId);
            console.log("Request Body:", payload);

            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="loading-spinner" style="width: 1rem; height: 1rem; border-width: 2px;"></span> Processing...';
            submitBtn.disabled = true;

            try {
                const response = await AccountAPI.createAccount(payload);
                showToast(response.message || 'Account created successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'accounts.html';
                }, 1500);
            } catch (error) {
                showToast(error.message, 'error');
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
            }
        });

        // Clear errors on input
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', () => clearError(input));
        });
    </script>
</body>
</html>
