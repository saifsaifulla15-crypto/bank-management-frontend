<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bank - Bank Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/banks.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <!-- (Same sidebar as banks.html) -->
            <div class="sidebar-header">
                <i class="fas fa-university" style="margin-right: 0.75rem;"></i>
                BankAdmin
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Overview</div>
                    <a href="../index.html" class="nav-link">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Banks</div>
                    <a href="banks.html" class="nav-link">
                        <i class="fas fa-building"></i> All Banks
                    </a>
                    <a href="create-bank.html" class="nav-link active">
                        <i class="fas fa-plus-circle"></i> Create Bank
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Accounts</div>
                    <a href="accounts.html" class="nav-link">
                        <i class="fas fa-users"></i> All Accounts
                    </a>
                    <a href="create-account.html" class="nav-link">
                        <i class="fas fa-user-plus"></i> Create Account
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">Transactions</div>
                    <a href="transactions.html" class="nav-link">
                        <i class="fas fa-exchange-alt"></i> Menu
                    </a>
                    <a href="deposit.html" class="nav-link">
                        <i class="fas fa-arrow-down"></i> Deposit
                    </a>
                    <a href="withdraw.html" class="nav-link">
                        <i class="fas fa-arrow-up"></i> Withdraw
                    </a>
                    <a href="transfer.html" class="nav-link">
                        <i class="fas fa-random"></i> Transfer
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Navbar -->
            <header class="navbar">
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle Menu">
                    <i class="fas fa-bars"></i>
                </button>
                <div style="flex: 1;"></div>
                <div class="user-profile">
                    <span class="avatar">A</span>
                    <span style="font-weight: 500; font-size: 0.95rem;">Admin User</span>
                </div>
            </header>

            <!-- Page Content -->
            <main class="content-area">
                <div class="banks-header">
                    <div>
                        <h1 class="page-title">Create New Bank</h1>
                        <p class="page-description">Register a new bank branch in the system</p>
                    </div>
                    <a href="banks.html" class="btn btn-outline">
                        <i class="fas fa-arrow-left"></i> Back to Banks
                    </a>
                </div>

                <div class="card" style="max-width: 800px; margin: 0 auto;">
                    <form id="create-bank-form" novalidate>
                        <h2 class="section-title">Bank Details</h2>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group">
                                <label class="form-label" for="bankName">Bank Name *</label>
                                <input type="text" id="bankName" name="bankName" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="ifsc">IFSC Code *</label>
                                <input type="text" id="ifsc" name="ifsc" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="branchName">Branch Name *</label>
                                <input type="text" id="branchName" name="branchName" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="contact">Contact Number *</label>
                                <input type="number" id="contact" name="contact" class="form-control" required placeholder="10 digit number">
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label class="form-label" for="balance">Initial Balance (₹) *</label>
                                <input type="number" id="balance" name="balance" class="form-control" required min="0" step="0.01">
                            </div>
                        </div>

                        <hr style="margin: 2rem 0; border-color: var(--border);">

                        <h2 class="section-title">Address Details</h2>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                            <div class="form-group" style="grid-column: span 2;">
                                <label class="form-label" for="street">Street Address *</label>
                                <input type="text" id="street" name="street" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="city">City *</label>
                                <input type="text" id="city" name="city" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="state">State *</label>
                                <input type="text" id="state" name="state" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="pincode">Pincode *</label>
                                <input type="number" id="pincode" name="pincode" class="form-control" required>
                            </div>
                        </div>

                        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                            <button type="button" class="btn btn-outline" onclick="window.location.href='banks.html'">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="submit-btn">Create Bank</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script>
        document.getElementById('create-bank-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const submitBtn = document.getElementById('submit-btn');
            
            // Clear previous errors
            clearAllErrors(form);
            
            let isValid = true;

            // Simple validation
            const bankName = form.bankName.value.trim();
            if (!bankName) { showError(form.bankName, 'Bank Name is required'); isValid = false; }
            
            const ifsc = form.ifsc.value.trim();
            if (!ifsc) { showError(form.ifsc, 'IFSC is required'); isValid = false; }

            const branchName = form.branchName.value.trim();
            if (!branchName) { showError(form.branchName, 'Branch Name is required'); isValid = false; }

            const contact = form.contact.value.trim();
            if (!contact || contact.length !== 10 || isNaN(contact)) { 
                showError(form.contact, 'Valid 10-digit contact number required'); 
                isValid = false; 
            }

            const balance = parseFloat(form.balance.value);
            if (isNaN(balance) || balance < 0) { 
                showError(form.balance, 'Balance must be a positive number'); 
                isValid = false; 
            }

            const street = form.street.value.trim();
            if (!street) { showError(form.street, 'Street is required'); isValid = false; }

            const city = form.city.value.trim();
            if (!city) { showError(form.city, 'City is required'); isValid = false; }

            const state = form.state.value.trim();
            if (!state) { showError(form.state, 'State is required'); isValid = false; }

            const pincode = form.pincode.value.trim();
            if (!pincode || pincode.length !== 6 || isNaN(pincode)) { 
                showError(form.pincode, 'Valid 6-digit pincode required'); 
                isValid = false; 
            }

            if (!isValid) return;

            // Construct payload
            const payload = {
                bankName,
                ifsc,
                branchName,
                contact: parseInt(contact),
                balance,
                address: {
                    street,
                    city,
                    state,
                    pincode: parseInt(pincode)
                }
            };

            // Loading state
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="loading-spinner" style="width: 1rem; height: 1rem; border-width: 2px;"></span> Processing...';
            submitBtn.disabled = true;

            try {
                const response = await BankAPI.createBank(payload);
                showToast(response.message || 'Bank created successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'banks.html';
                }, 1500);
            } catch (error) {
                showToast(error.message, 'error');
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
            }
        });

        // Clear errors on input
        document.querySelectorAll('.form-control').forEach(input => {
            input.addEventListener('input', () => clearError(input));
        });
    </script>
</body>
</html>
